<!DOCTYPE html>
<html lang="en">

<head>
    {% include 'base.html' %}
</head>

<body>
    {% include 'nav.html' %}
    
    <div class="container mt-5">
        <div class="row mb-5">
            <div class="col-12">
                <h1 class="display-4 fw-bold">Latest News Articles</h1>
                <p class="lead text-muted">Stay updated with fresh news</p>
            </div>
        </div>

        {% for article in articles %}
        <div class="card mb-3">
            <div class="card-body">
                <div class="row align-items-center">
                    <div class="col-md-9">
                        <h5 class="card-title mb-0">{{ article.Headline }}</h5>
                    </div>
                    <div class="col-md-3 text-end">
                        <a href="{{ article.Detail_link }}" class="btn btn-success btn-sm">Read More</a>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

</body>

</html>
